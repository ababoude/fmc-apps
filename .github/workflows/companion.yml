# The iPhone companion of apps/webhook, built into an .ipa on a GitHub-hosted macOS runner: no Mac, no Xcode and no
# Darwin SDK of your own. Run it from the Actions tab — the GitHub app on an iPhone can do that — and download the
# artifact, then install it with an on-device signer.
#
# The build is unsigned unless the signing secrets are set, so a free Apple ID plus an on-device signer (Sideloadly,
# AltStore, ESign) can install it. Set IOS_TEAM_ID, IOS_CERTIFICATE_P12, IOS_CERTIFICATE_PASSWORD and
# IOS_PROVISIONING_PROFILE (the .p12 and .mobileprovision, base64-encoded) for a signed .ipa you can also open in
# Xcode. The bundle id is fmc.shortcuts.ShortcutsWatch: the profile has to name it.
name: Companion

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version stamped on the .ipa; defaults to the one in store.toml"
        default: ""
      xcode:
        description: "Xcode to build with, e.g. 26.2 (empty = image default, iOS 18 SDK)"
        default: ""
  push:
    branches: [main]
    paths:
      - "apps/webhook/companion/**"
      - ".github/workflows/companion.yml"

permissions:
  contents: read

env:
  APP: apps/webhook/companion

jobs:
  ipa:
    # macos-15 is arm64 and its hosted pool is often at capacity (GitHub then cancels the job after ~15 min with
    # "The job was not acquired by Runner of type hosted"). The Intel pool is less contended and runs the same
    # Xcode toolchain; the .ipa is identical. Switch back to macos-15 only if Intel ever becomes unavailable.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7

      - name: Report the toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Select Xcode
        env:
          XCODE: ${{ inputs.xcode }}
        run: |
          # The macos-15 image defaults to Xcode 16.4 (iOS 18 SDK). Pick a newer one to build against iOS 26:
          # `xcode-select -s /Applications/Xcode_26.2.app`. An unknown version fails here, before the build.
          if [ -n "$XCODE" ]; then
            app="/Applications/Xcode_$XCODE.app"
            [ -d "$app" ] || { echo "::error::Xcode $XCODE is not installed on this image"; ls -d /Applications/Xcode_*.app; exit 1; }
            sudo xcode-select -s "$app"
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
          fi

      - name: Read the version
        id: stamp
        env:
          INPUT_VERSION: ${{ inputs.version }}
        working-directory: ${{ env.APP }}
        run: |
          version="${INPUT_VERSION:-$(sed -n 's/^version *= *"\(.*\)"/\1/p' ../store.toml)}"
          # CFBundleShortVersionString is MAJOR.MINOR.PATCH with digits only, so `1.2.3-beta` stamps 1.2.3.
          short="$(printf '%s' "$version" \
            | sed -n 's/^\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p')"
          echo "short=${short:-0.1.0}" >> "$GITHUB_OUTPUT"

      # The wire format, AES, CRC32 and the action plan are CoreBluetooth-free, so they are tested here too.
      - name: Test the shared core
        working-directory: ${{ env.APP }}
        run: swift test

      - name: Generate the Xcode project
        working-directory: ${{ env.APP }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Stamp the version
        working-directory: ${{ env.APP }}
        env:
          SHORT: ${{ steps.stamp.outputs.short }}
          BUILD: ${{ github.run_number }}
        run: |
          plutil -replace CFBundleShortVersionString -string "$SHORT" Info.plist
          plutil -replace CFBundleVersion -string "$BUILD" Info.plist
          plutil -p Info.plist

      - name: Detect the signing identity
        id: signing
        env:
          TEAM: ${{ secrets.IOS_TEAM_ID }}
          P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          if [ -n "$TEAM" ] && [ -n "$P12" ] && [ -n "$PROFILE" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Unsigned build::No signing secrets, so the .ipa needs an on-device signer."
          fi

      - name: Build (unsigned)
        if: steps.signing.outputs.signed != 'true'
        working-directory: ${{ env.APP }}
        env:
          MIN_IOS: "17.0"
        run: |
          # IPHONEOS_DEPLOYMENT_TARGET is passed explicitly: a missing value in the generated project bakes the
          # runner's SDK version (e.g. 26.0) into MinimumOSVersion, and iOS then refuses to install the .ipa with a
          # bare "cannot be installed" and no useful message on the phone.
          xcodebuild build \
            -project ShortcutsWatch.xcodeproj \
            -scheme ShortcutsWatch \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            IPHONEOS_DEPLOYMENT_TARGET="$MIN_IOS" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Check the app bundle
        if: steps.signing.outputs.signed != 'true'
        env:
          MIN_IOS: "17.0"
        run: |
          app="$RUNNER_TEMP/derived/Build/Products/Release-iphoneos/ShortcutsWatch.app"
          [ -d "$app" ] || { echo "::error::no .app at $app"; exit 1; }
          # These four keys decide whether iOS installs the bundle at all; print them and fail loudly on a mismatch.
          plutil -p "$app/Info.plist" | tee "$RUNNER_TEMP/appinfo.txt"
          exec_file="$(plutil -extract CFBundleExecutable raw -o - "$app/Info.plist")"
          [ -x "$app/$exec_file" ] || { echo "::error::missing executable $exec_file"; exit 1; }
          # A device build must carry an arm64 slice. A simulator or x86_64-only binary signs fine and then refuses
          # to install, which looks exactly like a signing problem.
          lipo -info "$app/$exec_file"
          lipo -info "$app/$exec_file" | grep -q arm64 || { echo "::error::$exec_file has no arm64 slice"; exit 1; }
          for key in DTSDKName DTPlatformVersion; do
            printf '%s = %s\n' "$key" "$(plutil -extract "$key" raw -o - "$app/Info.plist" 2>/dev/null || echo unknown)"
          done | tee -a "$RUNNER_TEMP/appinfo.txt"
          min="$(plutil -extract MinimumOSVersion raw -o - "$app/Info.plist")"
          [ -n "$min" ] || { echo "::error::no MinimumOSVersion"; exit 1; }
          # A compiled-in entitlements file is required by signers using Enterprise/wildcard certificates
          # (Feather, DxSign, ESign...): without it iOS rejects the installation after re-signing.
          codesign -d --entitlements :- "$app/$exec_file" 2>/dev/null | tee "$RUNNER_TEMP/entitlements.txt" \
            | grep -q 'get-task-allow' || { echo "::warning::no get-task-allow entitlement in the binary"; }
          # Fail only when the bundle asks for a newer iOS than we intend (e.g. 26.0 baked in by the SDK).
          awk -v a="$min" -v b="$MIN_IOS" 'BEGIN{
            split(a,x,"."); split(b,y,".")
            if (x[1] > y[1]) exit 1
            if (x[1] == y[1] && x[2] > y[2]) exit 1
            exit 0
          }' || { echo "::error::MinimumOSVersion $min is above the intended $MIN_IOS"; exit 1; }
          echo "MinimumOSVersion $min (target $MIN_IOS)"
          for key in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion CFBundlePackageType \
                     CFBundleSupportedPlatforms MinimumOSVersion UIDeviceFamily; do
            plutil -extract "$key" raw -o - "$app/Info.plist" >/dev/null \
              || { echo "::error::missing $key in the built Info.plist"; exit 1; }
          done
          # Also surface it in the run summary: this is what iOS checks before it says "cannot be installed".
          {
            echo "### Built bundle"
            echo
            echo '```'
            cat "$RUNNER_TEMP/appinfo.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Import the signing identity
        if: steps.signing.outputs.signed == 'true'
        env:
          P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security default-keychain -s "$keychain"
          printf '%s' "$P12" | tr -d '[:space:]' | openssl base64 -d -A > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"

          # The profile has to sit under its UUID: that is how Xcode finds it, whatever the file was called locally.
          printf '%s' "$PROFILE" | tr -d '[:space:]' | openssl base64 -d -A > "$RUNNER_TEMP/companion.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/companion.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          uuid="$(plutil -extract UUID raw -o - "$RUNNER_TEMP/profile.plist")"
          name="$(plutil -extract Name raw -o - "$RUNNER_TEMP/profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/companion.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          echo "PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$name" >> "$GITHUB_ENV"
          echo "Using profile '$name' ($uuid)"

      - name: Build (signed)
        if: steps.signing.outputs.signed == 'true'
        working-directory: ${{ env.APP }}
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project ShortcutsWatch.xcodeproj \
            -scheme ShortcutsWatch \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ShortcutsWatch.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            CODE_SIGN_IDENTITY="Apple Development"

      - name: Package the .ipa
        id: package
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          SHORT: ${{ steps.stamp.outputs.short }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          # PROFILE_NAME comes from the import step's GITHUB_ENV, not from the workflow-level env block, which is
          # resolved before that step runs.
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          if [ "$SIGNED" = "true" ]; then
            plist="$RUNNER_TEMP/ExportOptions.plist"
            {
              echo '<?xml version="1.0" encoding="UTF-8"?>'
              echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
              echo '<plist version="1.0">'
              echo '<dict>'
              echo '  <key>method</key><string>development</string>'
              echo "  <key>teamID</key><string>$TEAM_ID</string>"
              echo '  <key>signingStyle</key><string>manual</string>'
              echo '  <key>provisioningProfiles</key>'
              echo '  <dict>'
              echo "    <key>fmc.shortcuts.ShortcutsWatch</key><string>$PROFILE_NAME</string>"
              echo '  </dict>'
              echo '  <key>stripSwiftSymbols</key><true/>'
              echo '</dict>'
              echo '</plist>'
            } > "$plist"
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/ShortcutsWatch.xcarchive" \
              -exportOptionsPlist "$plist" \
              -exportPath "$out"
            ipa="$out/ShortcutsWatch.ipa"
            [ -f "$ipa" ] || { echo "::error::xcodebuild produced no .ipa at $ipa"; ls -R "$out"; exit 1; }
          else
            # An unsigned .ipa is just a Payload/ folder zipped; an on-device signer installs it from there.
            app="$RUNNER_TEMP/derived/Build/Products/Release-iphoneos/ShortcutsWatch.app"
            [ -d "$app" ] || { echo "::error::no .app at $app"; ls -R "$RUNNER_TEMP/derived/Build/Products" || true; exit 1; }
            mkdir -p "$out/Payload"
            cp -R "$app" "$out/Payload/"
            # `ditto -c -k --sequesterRsrc --keepParent` is what Apple's own tools use for an .ipa: it keeps resource
            # forks and directory metadata that some installers need. A plain `zip -r` can produce an archive iOS or
            # an on-device signer accepts but refuses to install.
            ditto -c -k --sequesterRsrc --keepParent "$out/Payload" "$out/Shortcuts-unsigned.ipa"
            ipa="$out/Shortcuts-unsigned.ipa"
          fi
          final="$out/Shortcuts-$SHORT.ipa"
          mv "$ipa" "$final"
          [ -s "$final" ] || { echo "::error::$final is empty"; exit 1; }
          unzip -l "$final" | head -20
          echo "ipa=$final" >> "$GITHUB_OUTPUT"
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"

      - name: Attach the .ipa to the run
        env:
          SIGNED: ${{ steps.package.outputs.signed }}
        run: |
          {
            echo "### Shortcuts companion ${{ steps.stamp.outputs.short }}"
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "Signed .ipa; install it from Files or with Xcode."
            else
              echo "**Unsigned** .ipa: sign it on the phone with Sideloadly, AltStore or ESign and a free Apple ID."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: Shortcuts-${{ steps.stamp.outputs.short }}
          path: ${{ steps.package.outputs.ipa }}
          if-no-files-found: error
