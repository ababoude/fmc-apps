<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#4CC9FF"/>
      <stop offset="0.5" stop-color="#4C6BFF"/>
      <stop offset="1" stop-color="#7A33E8"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.32" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.4" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <circle cx="48" cy="48" r="48" fill="url(#bg)"/>
  <circle cx="48" cy="48" r="48" fill="url(#sheen)"/>
  <circle cx="48" cy="48" r="47" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="2"/>
  <g filter="url(#shadow)" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- a watch strap -->
    <path d="M34 20h28M34 76h28" stroke-width="5" stroke-opacity="0.55"/>
    <!-- a rounded watch body -->
    <rect x="24" y="26" width="48" height="44" rx="14" stroke-width="5"/>
    <!-- the tap: a bolt leaves the screen towards the phone -->
    <path d="M50 36 L41 50h7l-4 12 11-16h-7z" fill="#fff" stroke="none"/>
  </g>
</svg>
